name: Publish extension

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'eejyang/miku-volume'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('The release tag must match the stable package.json version, e.g. v1.0.1.');
          }
          JS
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Package extension
        run: |
          mkdir -p builds
          npx vsce package --no-dependencies --githubBranch main --out builds/miku-volume.vsix
      - name: Save VSIX
        uses: actions/upload-artifact@v4
        with:
          name: miku-volume-${{ github.ref_name }}
          path: builds/miku-volume.vsix
          if-no-files-found: error
      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath builds/miku-volume.vsix
